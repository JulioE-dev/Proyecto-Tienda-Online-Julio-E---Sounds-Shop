<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto - Julio E - Sounds Shop</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png" />
    <meta name="description" content="Julio E - Sounds Shop: Equipos profesionales para DJs.">
    <meta name="keywords" content="Julio E, Música, DJ, Club, Equipamiento para Dj´s, Controladoras">
    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="css/contacto.css" />
</head>
<body>

    <div class="fondo">

        <div class="contenedor-header">
            <header>
                <div class="JulioE">
                    <a href="index.html">JULIO E - SOUNDS SHOP</a>
                </div>

                <input type="checkbox" id="toggle-menu" class="toggle-menu" />
                <label for="toggle-menu" class="nav-icon">
                    <i class="fa-solid fa-bars"></i>
                </label>
                <nav id="nav">
                    <ul>
                        <li><a href="index.html">INICIO</a></li>
                        <li><a href="producto.html">PRODUCTO</a></li>
                        <li><a href="contacto.html">CONTACTO</a></li>
                    </ul>
                </nav>
            </header>
        </div>

        <main class="contenido-principal">
            <section id="CONTACTO" class="seccion CONTACTO">
                <h2>CONTACTO</h2>
                <form action="#" method="post" class="form-contacto" id="formulario-contacto">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Tu email">

                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí"></textarea>

                    <button type="submit" id="btn-enviar">Enviar</button>
                </form>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2026 JULIO E - SOUNDS SHOP - Todos los derechos reservados.</p>
        </footer>

    </div>

    <script src="js/main.js"></script>
</body>
</html>
